name: Testen en online zetten

# De echte app (branch main) staat op /lijstjes/, de testversie (branch TEST_BRANCH) op /lijstjes/test/.
# Elke push naar een van beide zet beide opnieuw online; de echte app komt altijd van main.
on:
  push:
    branches: [main, claude/project-thread-jutjqn]
  workflow_dispatch:

env:
  TEST_BRANCH: claude/project-thread-jutjqn

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Echte app testen en bouwen
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build

      - name: Testversie ophalen
        id: test
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" "$TEST_BRANCH"; then
            echo "bestaat=ja" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.test.outputs.bestaat == 'ja'
        with:
          ref: ${{ env.TEST_BRANCH }}
          path: test
      - name: Testversie testen en bouwen
        if: steps.test.outputs.bestaat == 'ja'
        working-directory: test
        env:
          VITE_TEST: '1'
        run: |
          npm ci
          npm test
          npm run build -- --outDir ../app/dist/test --emptyOutDir

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
