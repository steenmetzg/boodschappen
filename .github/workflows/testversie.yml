name: Testversie online zetten

# Een push naar de testbranch start "Testen en online zetten" op main, die ook de testbranch
# bouwt en op /lijstjes/test/ zet (zie deploy.yml).
on:
  push:
    branches: [claude/project-thread-jutjqn]

permissions:
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
